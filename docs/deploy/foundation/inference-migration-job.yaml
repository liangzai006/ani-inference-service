# One-shot Inference schema migration for the new-cluster PostgreSQL instance.
# Create the inference-migrations-20260922 ConfigMap from the
# ani-inference-service/migrations directory before applying this Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: inference-migrations-20260922
  namespace: ani-system
  labels:
    app.kubernetes.io/name: inference-migrations
    ani.liangzai006.io/environment: new-cluster
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference-migrations
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: quay.io/sclorg/postgresql-16-c9s@sha256:8cfb29c886b54dd2c535e24896dffe45ff47a3006b9e880ef864415683f1daed
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: inference-postgres-auth
                  key: username
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inference-postgres-auth
                  key: password
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: inference-postgres-auth
                  key: database
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
          command:
            - sh
            - -ec
            - |
              export PGPASSWORD="$POSTGRESQL_PASSWORD"
              for file in $(find /migrations -maxdepth 1 \( -type f -o -type l \) -name '*.sql' | sort); do
                echo "applying $(basename "$file")"
                psql -v ON_ERROR_STOP=1 -h "$PGHOST" -p "$PGPORT" -U "$POSTGRESQL_USER" -d "$POSTGRESQL_DATABASE" -f "$file"
              done
              psql -v ON_ERROR_STOP=1 -h "$PGHOST" -p "$PGPORT" -U "$POSTGRESQL_USER" -d "$POSTGRESQL_DATABASE" -Atqc "select 'inference_tables=' || count(*) from information_schema.tables where table_schema='public' and table_name like 'inference_%'"
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: migrations
          configMap:
            name: inference-migrations-20260922
