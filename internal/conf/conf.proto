syntax = "proto3";

package inference.config.v1;

option go_package = "github.com/liangzai006/ani-inference-service/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  // Optional outbound Governance refund wiring. Inbound commands use the
  // ordinary TLS gRPC listener and verified tenant metadata.
  ManagedGPU managed_gpu = 2;
}

message ManagedGPU {
  message Refund {
    string address = 1;
    string ca_file = 2;
    string cert_file = 3;
    string key_file = 4;
    string server_name = 5;
    google.protobuf.Duration timeout = 6;
  }
  reserved 1;
  Refund refund = 2;
}

message Server {
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }

  message Admin {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }

  GRPC grpc = 1;
  Admin admin = 2;
  google.protobuf.Duration shutdown_timeout = 3;
}
