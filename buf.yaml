version: v2
# The Accelerator module is mounted as upstream/accelerator by
# scripts/generate-api.sh. Keeping it out of this repository prevents copied
# generated contracts from drifting from the pinned API module.
modules:
  - path: api
  - path: internal
    # Private configuration has its own protobuf namespace while the Go
    # package remains internal/conf.
    lint:
      use:
        - MINIMAL
      except:
        - PACKAGE_DIRECTORY_MATCH
lint:
  use:
    - MINIMAL
