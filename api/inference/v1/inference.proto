syntax = "proto3";

package inference.v1;

option go_package = "github.com/liangzai006/ani-inference-service/api/inference/v1;inferencev1";

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "accelerator/v1/accelerator.proto";
import "accelerator/command/v1/command.proto";

message ResourceSpec {
  map<string, string> requests = 1;
  map<string, string> limits = 2;
  GpuRequest gpu = 3;
}

// GPU placement is resolved by the accelerator service. The inference API
// carries the immutable request shape; it does not accept physical devices or
// synthesize provider flags.
message GpuRequest {
  string cluster_id = 1;
  string pool_id = 2;
  string profile_id = 3;
  uint64 profile_version = 4;
  // Number of GPU-bearing Pods. For LWS this is groups * (leader + workers).
  uint32 replicas = 5;
  uint32 devices_per_replica = 6;
  string container_name = 7;
}

enum RuntimeMode {
  RUNTIME_MODE_UNSPECIFIED = 0;
  RUNTIME_MODE_DEPLOYMENT = 1;
  RUNTIME_MODE_LEADER_WORKER_SET = 2;
}

message RuntimeSpec {
  RuntimeMode mode = 1;
  // Number of workers in each LeaderWorkerSet group. It is ignored for a
  // Deployment and must be positive for the distributed mode.
  int32 worker_replicas = 2;
  EndpointSpec endpoint = 3;
  // Runtime provider for new requests is KServe. Create omits this field to
  // use KServe; update treats empty as inherit for an existing generation.
  // The legacy deployment value is persisted only for old generations.
  string provider = 4;
}

// EndpointSpec describes the optional Kubernetes Service exposed for this
// runtime. Ports are explicit; an omitted endpoint means no Service is owned.
message EndpointSpec {
  int32 container_port = 1;
  int32 service_port = 2;
  string target_port = 3;
  string protocol = 4;
}

message ModelArtifact {
  string provider = 1;
  string reference = 2;
  string sha256 = 3;
}

message EngineSpec {
  string type = 1;
  string image = 2;
  // command is the complete shell command, preserved byte-for-byte until
  // the Kubernetes adapter wraps it as ["/bin/sh", "-c"] plus one arg.
  string command = 5;
  reserved 3, 4;
  reserved "args";
}

// CommandContext binds a Governance command to one immutable owner resource.
// It carries no transport credentials; the mTLS service identity is verified
// by the receiver before this context is trusted.
message CommandContext {
  string tenant_id = 1;
  string resource_id = 2;
  string operation_id = 3;
  string request_digest = 4;
}

// Resource classification comes from the immutable accepted CREATE, never
// from an empty quota vector or the current directory.
enum ManagedResourceClass {
  MANAGED_RESOURCE_CLASS_UNSPECIFIED = 0;
  MANAGED_RESOURCE_CLASS_CPU = 1;
  MANAGED_RESOURCE_CLASS_GPU = 2;
}

// Governance-only delegation for closing a CREATE which the owner may not
// have accepted. The trusted original command, rather than Model availability,
// supplies the resource class and GPU cluster.
message ManagedDeleteScope {
  ManagedResourceClass resource_class = 1;
  string cluster_id = 2;
  string create_command_digest = 3;
}

message InferenceService {
  string id = 1;
  string name = 2;
  string desired_state = 3;
  int64 generation = 4;
  string model_version_id = 5;
  ResourceSpec resource = 6;
  int32 replicas = 7;
  string runtime_phase = 8;
  string publication_phase = 9;
  string invocation_health = 10;
  google.protobuf.Timestamp observed_at = 11;
  RuntimeSpec runtime = 12;
  ModelArtifact model_artifact = 13;
  EngineSpec engine = 14;
  // Latest generation whose runtime observation was durably committed.
  // This is distinct from desired generation and readiness facts.
  int64 applied_generation = 15;
  string served_model_name = 16;
}

message Operation {
  string id = 1;
  string service_id = 2;
  string kind = 3;
  string phase = 4;
  string step = 5;
  int64 target_generation = 6;
  string error_code = 7;
  string error_message = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp completed_at = 10;
}

message CreateInferenceServiceRequest {
  string request_id = 1;
  string name = 2;
  string model_version_id = 3;
  ResourceSpec resource = 4;
  int32 replicas = 5;
  RuntimeSpec runtime = 6;
  ModelArtifact model_artifact = 7;
  EngineSpec engine = 8;
  string served_model_name = 9;
  reserved 10, 11;
  reserved "gpu_owner_attachment", "original_charges";
  // Governance-only frozen command context and resolved GPU execution.
  CommandContext context = 12;
  string cluster_id = 13;
  accelerator.v1.GpuExecution gpu_execution = 14;
  accelerator.v1.GpuDisplay gpu_display = 15;
}
message UpdateInferenceServiceRequest {
  string request_id = 1;
  string resource_id = 2;
  int64 expected_generation = 3;
  google.protobuf.FieldMask update_mask = 4;
  ResourceSpec resource = 5;
  int32 replicas = 6;
  RuntimeSpec runtime = 7;
  ModelArtifact model_artifact = 8;
  EngineSpec engine = 9;
  string served_model_name = 10;
  string model_version_id = 11;
  CommandContext context = 12;
  string cluster_id = 13;
  accelerator.v1.GpuExecution gpu_execution = 14;
  accelerator.v1.GpuDisplay gpu_display = 15;
}
message ServiceCommandRequest { string request_id = 1; string resource_id = 2; int64 expected_generation = 3; }
message DeleteInferenceServiceRequest {
  string request_id = 1;
  string resource_id = 2;
  // Legacy direct records require generation. Governance commands do not.
  int64 expected_generation = 3;
  reserved 4, 5;
  reserved "gpu_owner_attachment", "original_charges";
  CommandContext context = 6;
  string create_operation_id = 7;
  ManagedDeleteScope managed_delete_scope = 8;
}
message GetInferenceServiceRequest { string resource_id = 1; }
message ListInferenceServicesRequest {
  reserved 1, 2;
  optional int32 page = 3;
  optional int32 page_size = 4 [json_name = "pageSize"];
  string status = 5;
  string capability = 6;
}
message ListInferenceServicesResponse {
  reserved 1, 2;
  reserved "services", "next_page_token";
  repeated InferenceService items = 3;
  int64 total = 4;
}
message OperationResponse {
  InferenceService resource = 1;
  Operation operation = 2;
  // Command accepted in the same transaction as its immutable context.
  // This is never evidence of workload readiness or physical release.
  accelerator.command.v1.DurableOwnerAck durable_owner_ack = 3;
}
message GetOperationRequest { string operation_id = 1; }
message ListOperationsRequest {
  reserved 1, 2;
  string resource_id = 3;
  optional int32 page = 4;
  optional int32 page_size = 5 [json_name = "pageSize"];
}
message ListOperationsResponse {
  reserved 1, 2;
  reserved "operations", "next_page_token";
  repeated Operation items = 3;
  int64 total = 4;
}

// ============================================================================
// Health: Query invocation health status and diagnostics
// ============================================================================

message GetServiceHealthRequest {
  string resource_id = 1;
}

message GetServiceHealthResponse {
  // Canonical health states: healthy, unhealthy, unknown, degraded
  string status = 1;
  // Explains why status is unknown: no recent observations, service not ready, etc.
  string reason = 2;
  google.protobuf.Timestamp last_check_time = 3;
  google.protobuf.Timestamp last_success_time = 4;
  repeated HealthCheck checks = 5;
}

message HealthCheck {
  string name = 1;
  string status = 2;
  string message = 3;
  google.protobuf.Timestamp checked_at = 4;
}

// ============================================================================
// Policy: Service-level access control (tenant allowlist, rate limits)
// Does NOT manage Higress gateway routes or HTTPRoute resources
// ============================================================================

message GetServicePolicyRequest {
  string resource_id = 1;
}

message GetServicePolicyResponse {
  ServicePolicy policy = 1;
}

message UpdateServicePolicyRequest {
  string resource_id = 1;
  ServicePolicy policy = 2;
}

message UpdateServicePolicyResponse {
  ServicePolicy policy = 1;
}

message ServicePolicy {
  string resource_id = 1;
  // Tenant allowlist for service-level authorization
  repeated string allowed_tenants = 2;
  // Rate limit configuration per tenant
  map<string, RateLimitConfig> rate_limits = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message RateLimitConfig {
  int32 requests_per_minute = 1;
  int32 requests_per_hour = 2;
}

// ============================================================================
// Test: Manual invocation testing with configurable auth and format
// ============================================================================

message TestInvocationRequest {
  string resource_id = 1;
  // Optional override endpoint; defaults to service's published endpoint
  string endpoint_url = 2;
  // Authentication method: none, bearer, api_key
  string auth_method = 3;
  map<string, string> headers = 4;
  // Request body in JSON format for OpenAI-compatible completions
  string request_body = 5;
  // Enable streaming response
  bool stream = 6;
}

message TestInvocationResponse {
  int32 status_code = 1;
  map<string, string> response_headers = 2;
  string response_body = 3;
  int64 latency_ms = 4;
  string error_message = 5;
}

message TestInvocationChunk {
  string chunk = 1;
}

// ============================================================================
// Metrics: Query aggregated request volume, success rate, latency, resources
// ============================================================================

message GetServiceMetricsRequest {
  string resource_id = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
}

message GetServiceMetricsResponse {
  int64 total_requests = 1;
  int64 successful_requests = 2;
  int64 failed_requests = 3;
  // Success rate as percentage (0-100)
  double success_rate = 4;
  LatencyStats latency = 5;
  ResourceUsage resource_usage = 6;
}

message LatencyStats {
  double p50_ms = 1;
  double p95_ms = 2;
  double p99_ms = 3;
  double max_ms = 4;
}

message ResourceUsage {
  CpuUsage cpu = 1;
  MemoryUsage memory = 2;
  GpuUsage gpu = 3;
}

message CpuUsage {
  double average_cores = 1;
  double peak_cores = 2;
}

message MemoryUsage {
  int64 average_bytes = 1;
  int64 peak_bytes = 2;
}

message GpuUsage {
  double average_utilization_percent = 1;
  double peak_utilization_percent = 2;
  int64 average_memory_bytes = 3;
  int64 peak_memory_bytes = 4;
}

// ============================================================================
// Logs: Stream runtime logs with time range and pod filtering
// ============================================================================

message GetServiceLogsRequest {
  string resource_id = 1;
  google.protobuf.Timestamp since = 2;
  google.protobuf.Timestamp until = 3;
  // Filter by specific pod name; empty means all pods
  string pod_name = 4;
  // Stream new logs as they arrive
  bool follow = 5;
  // Limit initial lines; 0 means all available logs
  int32 tail_lines = 6;
}

message LogEntry {
  google.protobuf.Timestamp timestamp = 1;
  string pod_name = 2;
  string container_name = 3;
  string message = 4;
  // Log level: INFO, WARN, ERROR, DEBUG
  string level = 5;
}

// ============================================================================
// Events: Query Kubernetes events for this service's resources
// ============================================================================

message ListServiceEventsRequest {
  string resource_id = 1;
  optional int32 page = 2;
  optional int32 page_size = 3 [json_name = "pageSize"];
}

message ListServiceEventsResponse {
  repeated ServiceEvent items = 1;
  int64 total = 2;
}

message ServiceEvent {
  // Event type: Normal, Warning, Error
  string type = 1;
  google.protobuf.Timestamp timestamp = 2;
  // Short machine-readable reason: Scheduled, Pulling, Started, Failed, etc.
  string reason = 3;
  // Human-readable description
  string message = 4;
  // Event source: kubelet, kserve-controller, volcano-scheduler, etc.
  string source = 5;
  // Involved object: Pod, Deployment, InferenceService
  string object_kind = 6;
  string object_name = 7;
}

service InferenceServiceManager {
  // Lifecycle management
  rpc CreateInferenceService(CreateInferenceServiceRequest) returns (OperationResponse);
  rpc GetInferenceService(GetInferenceServiceRequest) returns (InferenceService);
  rpc ListInferenceServices(ListInferenceServicesRequest) returns (ListInferenceServicesResponse);
  rpc UpdateInferenceService(UpdateInferenceServiceRequest) returns (OperationResponse);
  rpc StartInferenceService(ServiceCommandRequest) returns (OperationResponse);
  rpc StopInferenceService(ServiceCommandRequest) returns (OperationResponse);
  rpc RestartInferenceService(ServiceCommandRequest) returns (OperationResponse);
  rpc DeleteInferenceService(DeleteInferenceServiceRequest) returns (OperationResponse);

  // Operations tracking
  rpc GetOperation(GetOperationRequest) returns (Operation);
  rpc ListOperations(ListOperationsRequest) returns (ListOperationsResponse);

  // Health monitoring
  rpc GetServiceHealth(GetServiceHealthRequest) returns (GetServiceHealthResponse);

  // Access policy (service-level, not gateway routes)
  rpc GetServicePolicy(GetServicePolicyRequest) returns (GetServicePolicyResponse);
  rpc UpdateServicePolicy(UpdateServicePolicyRequest) returns (UpdateServicePolicyResponse);

  // Manual invocation testing
  rpc TestInvocation(TestInvocationRequest) returns (TestInvocationResponse);
  rpc TestStreamInvocation(TestInvocationRequest) returns (stream TestInvocationChunk);

  // Metrics and observability
  rpc GetServiceMetrics(GetServiceMetricsRequest) returns (GetServiceMetricsResponse);
  rpc GetServiceLogs(GetServiceLogsRequest) returns (stream LogEntry);
  rpc ListServiceEvents(ListServiceEventsRequest) returns (ListServiceEventsResponse);
}
