replicaCount: 1

fullnameOverride: ""

# Database migration runs as a Helm pre-install/pre-upgrade hook. Set enabled
# to false after first install if schema changes are managed externally.
migration:
  enabled: true
  image:
    repository: docker.changqingyun.cn/library/postgres
    tag: 16-alpine
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  hookDeletePolicy: before-hook-creation
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

image:
  repository: docker.changqingyun.cn/ani/inference-service
  tag: main-ff24af7-20261016
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  # Empty uses the Helm release name. The account carries imagePullSecrets
  # for the control-plane Deployment.
  name: ""

runtimeServiceAccount:
  # This account is used only by materializer Jobs and KServe runtime Pods.
  # It has no RoleBinding; imagePullSecrets are its only chart-managed setting.
  name: ""

database:
  existingSecret: inference-database
  secretKey: dsn

# Must be provisioned separately; contains exactly 32 random raw bytes.
accessKeyEncryption:
  existingSecret: inference-access-key-encryption
  secretKey: key
  mountPath: /var/run/secrets/inference-access-key

imageRegistry:
  enabled: false
  grpcAddress: ""
  # Set from verified cluster/scheduling facts before enabling catalog intake.
  targetOS: ""
  targetArchitecture: ""
  targetVariant: ""
  # Client certificate must have the exact DNS SAN ani-inference-service.
  existingSecret: ""
  mountPath: /var/run/secrets/image-runtime

# Deployment facts of the single shared runtime namespace. They form the pull
# Secret scope together with the tenant and the registry authority, so they are
# never derived from a request or from the accelerator cluster ID.
inferenceRuntime:
  # Kubernetes cluster that hosts the runtime namespace (not ANI_ACCELERATOR_CLUSTER_ID).
  clusterID: ""
  # metadata.uid of the runtime namespace; the downward API cannot supply it.
  namespaceUID: ""

# One service identity for Accelerator, Resource image runtime and Gov quota.
# The Model client keeps its separately registered identity below.
serviceClientTLS:
  existingSecret: inference-service-client-tls
  certificate:
    create: true
    duration: 2160h
    renewBefore: 360h

governanceQuota:
  enabled: false
  grpcAddress: ""
  serverName: ani-governance

model:
  grpcAddress: ani-model-grpc.ani-system.svc.cluster.local:19090
  materializerImage: docker.changqingyun.cn/ani/model-import-worker:model-search-20261014-r1
  # Empty uses the cluster's default StorageClass.
  storageClass: ""
  # Zero-trust client identity for the Model call. cert-manager and the issuer
  # must already exist; this chart only requests the Certificate.
  tls:
    existingSecret: inference-model-mtls
    mountPath: /var/run/secrets/model
    caKey: ca.crt
    certKey: tls.crt
    keyKey: tls.key
    # Model service identity checked by the client. Not a cluster Service DNS name.
    serverName: ani-model.ani.internal
    certificate:
      create: true
      dnsName: ani-inference.ani.internal
      # Use the service-mtls reload binding when certificates are renewed.
      duration: 2160h
      renewBefore: 360h
    issuer:
      name: ani-internal
      kind: ClusterIssuer
      group: cert-manager.io

higress:
  # Public URL used by clients. Routes are managed through the Kubernetes
  # Gateway API; the Higress Console is not required at runtime.
  publicBaseURL: ""
  gatewayNamespace: higress-system
  gatewayName: ani-higress
  pathPrefix: /v1/completions
  routePrefix: /v1/
  bootstrapRouteName: ani-inference-model-router
  bootstrapServiceName: ani-inference-model-router-sink
  rateLimitNamespace: higress-system
  rateLimitPlugin: ani-request-rate-limit
  rbac:
    # The control-plane account needs to patch only rateLimitPlugin.
    create: true
    # Empty follows rateLimitNamespace. Keep an override equal to the
    # namespace containing rateLimitPlugin.
    namespace: ""

# The gateway authz adapter is an opt-in companion process. Enable it only
# after publishing an image that contains /ani-inference-gateway-authz and
# registering the private authz source and applying docs/deploy/higress/ext-auth.yaml.
gatewayAuthz:
  enabled: false
  image:
    repository: docker.changqingyun.cn/ani/inference-gateway-authz
    tag: main-ff24af7-20261016
    pullPolicy: IfNotPresent
  servicePort: 8080
  timeout: 900ms
  sourceHeaderValue: higress
  tls:
    existingSecret: ani-inference-gateway-authz-mtls
    mountPath: /var/run/secrets/gateway-authz/client
    caKey: ca.crt
    certKey: tls.crt
    keyKey: tls.key
    certificate:
      create: true
      dnsName: ani-inference-gateway.ani.internal
      duration: 2160h
      renewBefore: 360h
    issuer:
      name: ani-internal
      kind: ClusterIssuer
      group: cert-manager.io

# GPU resolution is opt-in. The accelerator client always uses TLS/mTLS.
accelerator:
  enabled: false
  grpcAddress: ""
  clusterID: ""
  serverName: ""
  tls:
    secretName: ""
    caFile: /var/run/secrets/accelerator/ca.crt
    certFile: /var/run/secrets/accelerator/tls.crt
    keyFile: /var/run/secrets/accelerator/tls.key

service:
  type: ClusterIP
  grpcPort: 19090
  adminPort: 19091

# Inference gRPC is always TLS 1.3 with a verified client certificate. This
# single listener is used by Governance for queries, CPU lifecycle and GPU
# contract commands, and by Model for reference checks.
serverTLS:
  existingSecret: ani-inference-server-tls
  mountPath: /var/run/secrets/inference-server
  caKey: ca.crt
  certKey: tls.crt
  keyKey: tls.key
  certificate:
    create: true
    dnsName: ani-inference.ani.internal
    # The process must restart on renewal; see the service-mtls reload binding.
    duration: 2160h
    renewBefore: 360h
    issuer:
      name: ani-internal
      kind: ClusterIssuer
      group: cert-manager.io

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsUser: 65534
  runAsGroup: 65534
  runAsNonRoot: true
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
