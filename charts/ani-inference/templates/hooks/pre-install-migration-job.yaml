{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ani-inference.fullname" . }}-migration-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ani-inference.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": {{ .Values.migration.hookDeletePolicy }}
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "ani-inference.labels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      {{- with .Values.migration.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "ani-inference.migrationImage" . | quote }}
          imagePullPolicy: {{ .Values.migration.imagePullPolicy }}
          env:
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ default .Values.database.existingSecret .Values.database.migrationSecret | quote }}
                  key: {{ default .Values.database.secretKey .Values.database.migrationSecretKey | quote }}
          command: [sh, -ec]
          args:
            - |
              echo "=== ANI Inference Database Migration ==="
              echo "Starting migration at $(date -Iseconds)"

              # Find all unique migration files by basename and sort
              cd /migrations
              migration_files=$(ls -1 *.sql 2>/dev/null | sort)

              if [ -z "$migration_files" ]; then
                echo "ERROR: No migration files found"
                exit 1
              fi

              migration_count=$(echo "$migration_files" | wc -l)
              echo "Found $migration_count migration file(s)"

              # Keep a service-specific ledger in the same database as the
              # inference schema. The name is intentionally distinct from
              # Model's schema_migrations table if operators share a database.
              # Each migration is executed once and the ledger row is written
              # in the same transaction as the migration. This makes a retry
              # safe when a Helm hook pod is restarted after a DDL failure.
              psql -v ON_ERROR_STOP=1 "$DATABASE_DSN" -c '
                CREATE TABLE IF NOT EXISTS public.inference_schema_migrations (
                  filename TEXT PRIMARY KEY,
                  applied_at TIMESTAMPTZ NOT NULL DEFAULT now()
                )'

              # An existing schema does not prove which migrations ran. Never
              # infer a baseline from a subset of tables or current files.
              ledger_count=$(psql -v ON_ERROR_STOP=1 "$DATABASE_DSN" -Atqc \
                "SELECT COUNT(*) FROM public.inference_schema_migrations")
              legacy_service=$(psql -v ON_ERROR_STOP=1 "$DATABASE_DSN" -Atqc \
                "SELECT CASE WHEN to_regclass('public.inference_services') IS NULL THEN 0 ELSE 1 END")
              if [ "$ledger_count" -eq 0 ] && [ "$legacy_service" -eq 1 ]; then
                echo "ERROR: existing inference schema has no migration ledger entries"
                echo "Verify the actual migration history and create an explicit baseline before retrying"
                exit 1
              fi

              for filename in $migration_files; do
                echo ""
                echo "--- Applying: $filename ---"
                # Filenames come from this chart's ConfigMap and are restricted
                # to the generated migration naming convention. The psql
                # variable is expanded inside this temporary script (rather
                # than passed through -c, where psql variables are not valid).
                case "$filename" in
                  [0-9][0-9][0-9][0-9][0-9][0-9]_*.sql) ;;
                  *) echo "ERROR: invalid migration filename: $filename"; exit 1 ;;
                esac
                script=$(mktemp)
                normalized=$(mktemp)
                trap 'rm -f "$script" "$normalized"' EXIT
                # These historical SQL files have an outer BEGIN/COMMIT for
                # manual execution. Strip only those known wrappers so psql's
                # transaction also covers the ledger insert and advisory lock.
                case "$filename" in
                  000021_managed_compute_close.sql|000022_inference_access_keys.sql|000023_inference_service_policies.sql|000025_inference_access_key_secrets.sql|000026_inference_access_policies.sql)
                    awk '
                      /^[[:space:]]*BEGIN;[[:space:]]*$/ { if (++begins != 1 || commits) exit 1; next }
                      /^[[:space:]]*COMMIT;[[:space:]]*$/ { if (++commits != 1 || begins != 1) exit 1; next }
                      { print }
                      END { if (begins != 1 || commits != 1) exit 1 }
                    ' "/migrations/$filename" >"$normalized" || { echo "ERROR: unexpected transaction wrapper in $filename"; exit 1; }
                    ;;
                  *) cp "/migrations/$filename" "$normalized" ;;
                esac
                if grep -Eiq '^[[:space:]]*(BEGIN|START[[:space:]]+TRANSACTION|COMMIT|END|ROLLBACK)([[:space:]]|;)' "$normalized"; then
                  echo "ERROR: unsupported transaction control in $filename"
                  exit 1
                fi
                cat >"$script" <<'PSQL'
              SELECT pg_advisory_xact_lock(hashtextextended('ani-inference-migrations', 0));
              SELECT EXISTS (
                SELECT 1 FROM public.inference_schema_migrations WHERE filename = :'filename'
              ) AS already_applied \gset
              \if :already_applied
                \echo 'migration already applied; skipping'
              \else
              PSQL
                cat "$normalized" >>"$script"
                cat >>"$script" <<'PSQL'

              INSERT INTO public.inference_schema_migrations(filename) VALUES (:'filename');
              \endif
              PSQL
                if psql --single-transaction -v ON_ERROR_STOP=1 \
                  -v filename="$filename" "$DATABASE_DSN" -f "$script"; then
                  echo "✓ $filename checked/applied successfully"
                else
                  echo "✗ $filename failed"
                  exit 1
                fi
                rm -f "$script" "$normalized"
                trap - EXIT
              done

              echo ""
              echo "=== Verifying Migration Result ==="

              table_count=$(psql -v ON_ERROR_STOP=1 "$DATABASE_DSN" -Atqc \
                "SELECT COUNT(*) FROM information_schema.tables
                 WHERE table_schema='public' AND table_name IN
                 ('inference_services', 'inference_deployments', 'inference_routes')")

              echo "Inference tables found: $table_count"

              if [ "$table_count" -eq 0 ]; then
                echo "WARNING: No expected tables found, this might be the first migration"
              fi

              echo ""
              echo "✓ Migration completed successfully at $(date -Iseconds)"
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
          {{- with .Values.migration.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: migrations
          configMap:
            name: {{ include "ani-inference.fullname" . }}-migrations
{{- end }}
