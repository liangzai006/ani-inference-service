{{- if .Values.higress.modelRouterBootstrapRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ani-inference.fullname" . }}-model-router
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ani-inference.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-routing
spec:
  parentRefs:
    - name: {{ required "higress.gatewayName is required" (trim .Values.higress.gatewayName) }}
      namespace: {{ required "higress.gatewayNamespace is required" (trim .Values.higress.gatewayNamespace) }}
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ required "higress.pathPrefix is required" (trim .Values.higress.pathPrefix) | quote }}
{{- end }}
