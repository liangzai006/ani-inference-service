apiVersion: v1
kind: Service
metadata:
  name: {{ include "ani-inference.fullname" . }}-grpc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ani-inference.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ani-inference.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ani-inference.fullname" . }}-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ani-inference.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ani-inference.selectorLabels" . | nindent 4 }}
  ports:
    - name: admin
      port: {{ .Values.service.adminPort }}
      targetPort: admin
