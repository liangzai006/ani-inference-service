apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ani-inference.runtimeServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ani-inference.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
{{- toYaml . | nindent 2 }}
{{- end }}
