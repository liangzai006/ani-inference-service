kserve:
  # The new environment pulls control-plane images from the local mirror.
  # Runtime model images remain caller-supplied in the Inference request.
  agent:
    image: docker.changqingyun.cn/mirror/kserve/agent
    tag: v0.16.0
  router:
    image: docker.changqingyun.cn/mirror/kserve/router
    tag: v0.16.0
  storage:
    image: docker.changqingyun.cn/mirror/kserve/storage-initializer
    tag: v0.16.0
  controller:
    image: docker.changqingyun.cn/mirror/kserve/kserve-controller
    tag: v0.16.0
    rbacProxyImage: docker.changqingyun.cn/mirror/brancz/kube-rbac-proxy:v0.18.0
    deploymentMode: Standard
    gateway:
      # ANI publishes the model-specific Higress HTTPRoutes.
      disableIngressCreation: true
      # Keep the existing hostname for shared namespaces. A standard tenant
      # namespace is 43 characters; separating it into its own DNS label
      # avoids KServe's 63-character label limit for normal service names.
      domainTemplate: '{{ if and (eq (len .Namespace) 43) (eq (printf "%.7s" .Namespace) "tenant-") }}{{ .Name }}.{{ .Namespace }}.{{ .IngressDomain }}{{ else }}{{ .Name }}-{{ .Namespace }}.{{ .IngressDomain }}{{ end }}'
      ingressGateway:
        enableGatewayApi: true
        createGateway: false
        kserveGateway: higress-system/ani-higress
