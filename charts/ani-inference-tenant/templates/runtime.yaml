apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ required "runtimeServiceAccount.name is required" .Values.runtimeServiceAccount.name }}
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: false
{{- with .Values.runtimeServiceAccount.imagePullSecrets }}
imagePullSecrets:
{{- toYaml . | nindent 2 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ani-inference-tenant-runtime
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["referencegrants"]
    verbs: ["get", "create", "delete"]
  - apiGroups: ["ani.kubercloud.com"]
    resources: ["inferenceservices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["ani.kubercloud.com"]
    resources: ["inferenceservices/status", "inferenceservices/finalizers"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices", "llminferenceservices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices/status", "inferenceservices/finalizers", "llminferenceservices/status", "llminferenceservices/finalizers"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["leaderworkerset.x-k8s.io"]
    resources: ["leaderworkersets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "statefulsets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["serviceaccounts", "configmaps", "pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ani-inference-tenant-runtime
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ required "inference.serviceAccount is required" .Values.inference.serviceAccount }}
    namespace: {{ required "inference.namespace is required" .Values.inference.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ani-inference-tenant-runtime
{{- if .Values.modelDownloadCA.name }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.modelDownloadCA.name }}
  namespace: {{ .Release.Namespace }}
data:
  {{ .Values.modelDownloadCA.key }}: {{ required "modelDownloadCA.bundle is required when modelDownloadCA.name is set" .Values.modelDownloadCA.bundle | quote }}
{{- end }}
